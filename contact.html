<section class="info">

    <h2>General Contact</h2>
    <p>HairlineAirline@support.com</p>
    <hr>

    <h2>Job Applications</h2>

    <form action="success.html" method="get">

        <label>Name</label><br>
        <input type="text" name="name"><br><br>

        <label>Email</label><br>
        <input type="email" name="email"><br><br>

        <label>Role</label><br>
        <select name="role">
            <option>Pilot</option>
            <option>Cabin Crew</option>
            <option>Engineer</option>
            <option>Ground Staff</option>
            <option>Co-Pilot</option>
            <option>Sales Cheif</option>
        </select><br><br>

        <label>Why join us?</label><br>
        <textarea rows="5" name="message"></textarea><br><br>

        <button type="submit" class="btn">Send Application</button>

    </form>

</section>
